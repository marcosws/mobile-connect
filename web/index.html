<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Connect</title>
</head>
<body>
    <h1>Mobile Connect</h1>
    <p>Welcome to Mobile Connect!</p>
    <hr />
    <h2>Connected Devices</h2>
    <ul id="device-list">
        <!-- Device list will be populated here -->
    </ul>
    <script>
        // Fetch the list of connected devices from the server
        fetch('http://localhost:8080/devices')
            .then(response => response.json())
            .then(data => {
                const deviceList = document.getElementById('device-list');
                data.forEach(device => {
                    const listItem = document.createElement('li');
                    listItem.textContent = `${device.id} - ${device.manufacturer} ${device.model} (Android ${device.androidVersion})`;
                    deviceList.appendChild(listItem);
                });
            })
            .catch(error => {
                console.error('Error fetching devices:', error);
            });
    </script>
</body>
</body>
</html>
